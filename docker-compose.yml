version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: equityiq-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=equityiq
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping: 1})"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: equityiq-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/equityiq
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=super-secret-key-change-in-production
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: equityiq-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENV=development
      - ALLOWED_CORS_ORIGINS=["http://localhost:5000","http://backend:5000","http://localhost:3000","*"]
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - chroma-data:/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; import sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode() == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: equityiq-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  chroma-data:
